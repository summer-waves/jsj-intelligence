# Starts the whole project with one command:   docker compose up --build
#   website  -> http://localhost:3000
#   API      -> http://localhost:8000/docs
# The Anthropic key is read from your terminal ($env:ANTHROPIC_API_KEY) and is never written to a file.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      JSJ_LIBRARY_MODE: "demo"
      JSJ_LLM: "anthropic"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in this terminal first}"
      JSJ_EXCERPT_WORDS: "150"
      JSJ_CORS_ORIGINS: "http://localhost:3000"
    volumes:
      # Cached embedding model, so it is downloaded only once.
      - hf-cache:/models

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  hf-cache:
