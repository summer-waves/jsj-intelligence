services:
  app:
    build: .
    ports:
      - "8502:8501"
    environment:
      # Ollama runs on your Windows machine, not inside the container.
      # host.docker.internal is Docker's name for "the computer running Docker".
      OLLAMA_URL: "http://host.docker.internal:11434/api/chat"
      JSJ_MODEL: "llama3.2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Your local data folder (chunks and cached embeddings) appears inside the container.
      - ./data:/app/data
      # Cached embedding model, so it is downloaded only once.
      - hf-cache:/models

volumes:
  hf-cache:
